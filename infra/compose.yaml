name: iwdtfv-personal
services:
  gateway:
    image: nginx:stable-alpine
    user: nginx
    command: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [isolated, outbound]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: iwdtfv-personal:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PORT: "8080"
      TRUST_PROXY: "1"
      HOSTNAME: "0.0.0.0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TEMP_DIR: /tmp/iwdtfv
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-1}
      MAX_FILESIZE_BYTES: ${MAX_FILESIZE_BYTES:-268435456}
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-268435456}
      YTDLP_PROXY: http://egress:3128
      YTDLP_JS_RUNTIMES: ${YTDLP_JS_RUNTIMES:-bun}
      YTDLP_FRAGMENT_CONCURRENCY: ${YTDLP_FRAGMENT_CONCURRENCY:-4}
      PERFORMANCE_METADATA_CACHE: ${PERFORMANCE_METADATA_CACHE:-1}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-7200}
      INSPECT_TIMEOUT_MS: ${INSPECT_TIMEOUT_MS:-30000}
      DOWNLOAD_TIMEOUT_MS: ${DOWNLOAD_TIMEOUT_MS:-900000}
      RATE_LIMIT_INSPECT_PER_MINUTE: ${RATE_LIMIT_INSPECT_PER_MINUTE:-20}
      RATE_LIMIT_DOWNLOAD_PER_MINUTE: ${RATE_LIMIT_DOWNLOAD_PER_MINUTE:-5}
      YTDLP_COOKIES_MODE: disabled
      APP_AUTH_MODE: ${APP_AUTH_MODE:-none}
      APP_ALLOWED_USERS: ${APP_ALLOWED_USERS:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2147483648,uid=1000,gid=1000,mode=1777
    networks: [isolated]
    depends_on:
      egress:
        condition: service_healthy
    mem_limit: 2g
    cpus: 3
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  egress:
    build:
      context: .
      dockerfile: proxy.Dockerfile
    restart: unless-stopped
    init: true
    networks: [isolated, outbound]
    mem_limit: 256m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "squid -k check"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  isolated:
    internal: true
  outbound:
volumes:
  data:
